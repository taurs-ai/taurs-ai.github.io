<!doctype html>
<!-- Generated by npm run build from templates/blog.html and blog/YYYYMMDD/*.md. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#fcfbf9">
  <title>{{title}}</title>
  <link rel="icon" type="image/png" href="{{root}}assets/taurs-ai-logo.png">
  <link rel="stylesheet" href="{{root}}assets/styles.css">
  <link rel="stylesheet" href="{{root}}assets/blog.css">
  {{scripts}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{root}}" aria-label="Tau.rs home">
        <img src="{{root}}assets/taurs-ai-logo-transparent.png" alt="Tau.rs" width="88" height="88">
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a class="nav-link" href="{{blog}}" {{current}}>Blog</a>
        <a class="nav-github" href="https://github.com/taurs-ai/tau.rs">
          GitHub
          <svg class="icon icon-small" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main class="container {{mainClass}}" id="main">
    {{content}}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="footer-brand" href="{{root}}" aria-label="Tau.rs home">Tau<span>.</span>rs</a>
      <p>Lightweight model inference in Rust.</p>
      <a class="footer-link" href="https://github.com/taurs-ai">taurs-ai on GitHub <span aria-hidden="true">↗</span></a>
    </div>
  </footer>
</body>
</html>
